<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiAppMonolito</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Marco del teléfono */
    .phone-frame {
      width: 375px;  /* Ancho iPhone X */
      height: 812px; /* Alto iPhone X */
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    /* Pantalla */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }
    
    /* Notch */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #000;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      z-index: 10;
    }
    
    /* Contenedor de la app */
    #root {
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
    
    /* Responsive: en móviles reales, quitar el marco */
    @media (max-width: 500px) {
      body { background: #fff; }
      .phone-frame {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        padding: 0;
      }
      .phone-screen { border-radius: 0; }
      .notch { display: none; }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="notch"></div>
      <div id="root"></div>
    </div>
  </div>
</body>
</html>
